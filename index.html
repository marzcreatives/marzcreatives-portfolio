<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarzCreatives</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
 <!-- Main WebGL canvas remains in the background -->
<div id="canvas-container"></div>

<!-- Container where Three.js will place the transformed HTML elements -->
<div id="css3d-container"></div>

<!-- Wrap your screen elements so they can be captured by the CSS3DRenderer -->
<div id="screen-html-wrapper" style="width: 800px; height: 600px; background: #111; overflow: hidden; display: none;">
  <div id="menu">
    <!-- Your existing menu markup -->
    <div id="content_container">
      <h1>MarzCreatives</h1>
      <p>Welcome to my immersive portfolio.</p>
      <div id="play_button" style="cursor: pointer;">
        <p>ENTER CONTROL ROOM</p>
      </div>
    </div>
  </div>

  <!-- <div id="about-overlay" style="display: none;">
    <button id="close-about">X</button>
    <h1>About the 3D Art Gallery</h1>
  </div> -->

  <div id="info-panel" style="display: none;">
    <div id="info-header">
        <h3>Controls</h3>
        <button id="toggle-info">Hide</button>
      </div>
      <div id="info-content">
        <p><b>W/A/S/D:</b> Move around</p>
        <p><b>Mouse:</b> Look around</p>
        <p><b>Space:</b> Toggle pointer lock</p>
        <p><b>M:</b> Show Menu</p>
        <p><b>Enter:</b> Start exploration</p>
        <p><b>Esc:</b> Stop exploration</p>
        <p><b>G:</b> Start audio guide</p>
        <p><b>P:</b> Stop audio guide</p>
      </div>
    </div>
</div>

   
    <script type="module" src="./main.js"></script>
</body>


</html>
